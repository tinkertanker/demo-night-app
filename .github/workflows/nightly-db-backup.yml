name: Nightly database backup

on:
  schedule:
    # 03:00 Asia/Singapore (UTC+8)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ENDPOINT: https://b8b1032c61d9475cd00229c74db7ec72.r2.cloudflarestorage.com
      R2_BUCKET: demo-night-backups
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Dump Neon production database
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "NEON_BACKUP_DATABASE_URL is not set"; exit 1; }
          pg_dump --version
          pg_dump -Fc -d "$DATABASE_URL" -f postgres.dump
          pg_restore --list postgres.dump > toc.txt
          echo "Tables with data: $(grep -c 'TABLE DATA' toc.txt)"
          ls -l postgres.dump

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          KEY="nightly/$(TZ=Asia/Singapore date +%F)/postgres.dump"
          aws s3 cp postgres.dump "s3://$R2_BUCKET/$KEY" --endpoint-url "$R2_ENDPOINT" --no-progress
          aws s3api head-object --bucket "$R2_BUCKET" --key "$KEY" --endpoint-url "$R2_ENDPOINT" --query ContentLength
          echo "Uploaded s3://$R2_BUCKET/$KEY" >> "$GITHUB_STEP_SUMMARY"
